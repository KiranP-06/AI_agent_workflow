- name: scheduled_workflow_check
  webhook: "{{NHOST_FUNCTIONS_URL}}/v1/scheduled-trigger-handler"
  schedule: "*/5 * * * *"
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 1
    retry_interval_seconds: 10
    timeout_seconds: 60
  headers: []
  comment: Checks for due scheduled workflow triggers every 5 minutes
