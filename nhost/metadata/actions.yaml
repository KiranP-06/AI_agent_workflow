actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/v1/trigger-workflow-run'
      forward_client_headers: true
      timeout: 120
    permissions:
      - role: user
    comment: Triggers a workflow run with permission checks and quota enforcement
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/v1/approve-step'
      forward_client_headers: true
      timeout: 120
    permissions:
      - role: user
    comment: Approves a paused approval_gate step and resumes the workflow run
  - name: webhookTrigger
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/v1/webhook-trigger'
      forward_client_headers: false
      timeout: 120
    comment: Inbound webhook endpoint to trigger a workflow run externally
custom_types:
  input_objects:
    - name: TriggerWorkflowRunInput
      fields:
        - name: workflow_id
          type: uuid!
    - name: ApproveStepInput
      fields:
        - name: step_run_id
          type: uuid!
    - name: WebhookTriggerInput
      fields:
        - name: workflow_id
          type: uuid!
        - name: webhook_secret
          type: String!
        - name: payload
          type: jsonb
  objects:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: run_id
          type: uuid!
        - name: status
          type: String!
        - name: message
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: success
          type: Boolean!
        - name: message
          type: String!
        - name: run_id
          type: uuid
    - name: WebhookTriggerOutput
      fields:
        - name: run_id
          type: uuid!
        - name: status
          type: String!
        - name: message
          type: String!
