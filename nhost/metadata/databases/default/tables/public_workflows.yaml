table:
  schema: public
  name: workflows
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_steps
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_triggers
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_runs
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - is_active
        - created_by
        - created_at
        - updated_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - name
        - description
        - is_active
        - created_by
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
