table:
  schema: public
  name: workflow_steps
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - step_order
        - step_type
        - name
        - config
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      columns:
        - workflow_id
        - step_order
        - step_type
        - name
        - config
      check:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
update_permissions:
  - role: user
    permission:
      columns:
        - step_order
        - step_type
        - name
        - config
      filter:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
