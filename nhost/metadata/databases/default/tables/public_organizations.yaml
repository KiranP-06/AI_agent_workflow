table:
  schema: public
  name: organizations
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          schema: public
          name: org_members
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          schema: public
          name: workflows
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - slug
        - quota_limit
        - quota_used
        - quota_period_start
        - created_at
        - updated_at
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns:
        - name
        - slug
        - quota_limit
      check: {}
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - slug
        - quota_limit
        - quota_used
        - quota_period_start
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: owner
      check: {}
