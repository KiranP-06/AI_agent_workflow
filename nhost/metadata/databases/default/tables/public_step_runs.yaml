table:
  schema: public
  name: step_runs
object_relationships:
  - name: run
    using:
      foreign_key_constraint_on: run_id
  - name: step
    using:
      foreign_key_constraint_on: step_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - run_id
        - step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - completed_at
        - created_at
        - updated_at
      filter:
        run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns:
        - run_id
        - step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - completed_at
      check:
        run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - editor
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - completed_at
      filter:
        run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - editor
      check: {}
