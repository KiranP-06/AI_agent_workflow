table:
  schema: public
  name: workflow_runs
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: run_id
        table:
          schema: public
          name: step_runs
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - triggered_by
        - trigger_type
        - status
        - started_at
        - completed_at
        - error
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns:
        - workflow_id
        - triggered_by
        - trigger_type
        - status
      check:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - completed_at
        - error
      filter:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
      check: {}
